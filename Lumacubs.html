<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <title>Lumacubs — Alphabet Fun for Little Learners</title>
  <meta name="description" content="Lumacubs is a colorful alphabet game for toddlers, built around everyday essentials like milk, toothbrush and soap.">
  <meta name="theme-color" content="#aee9ff">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Lumacubs">
  <style>
/* ============================================================
   Lumacubs — v2 playful redesign
   Sky-candy scene, gradient tiles, mascot, springy motion
   ============================================================ */

:root {
  --pink:   #ff6b9d;
  --yellow: #ffd93d;
  --green:  #6bcb77;
  --blue:   #4d96ff;
  --orange: #ff9f43;
  --purple: #a78bfa;
  --ink:    #3b3b5c;
  --paper:  #ffffff;
  --good:   #d9f7e2;
  --spring: cubic-bezier(0.34, 1.56, 0.64, 1);
  --shadow: 0 6px 0 rgba(59, 59, 92, 0.18);
}

* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

html, body { height: 100%; }

body {
  margin: 0;
  font-family: ui-rounded, "SF Pro Rounded", "Segoe UI", system-ui, -apple-system, sans-serif;
  color: var(--ink);
  background: linear-gradient(180deg, #6ec6ff 0%, #b39ddb 38%, #f8bbd0 72%, #ffe0b2 100%);
  background-attachment: fixed;
  min-height: 100vh;
  user-select: none;
  -webkit-user-select: none;
  touch-action: manipulation;
  overflow-x: hidden;
}

button {
  font-family: inherit;
  touch-action: manipulation;
}
button:focus-visible { outline: 3px solid var(--blue); outline-offset: 2px; }

.hidden { display: none !important; }

/* ---------------- floating background scene ---------------- */

#bg {
  position: fixed;
  inset: 0;
  pointer-events: none;
  z-index: 0;
  overflow: hidden;
}

#bg .deco {
  position: absolute;
  top: -12%;
  will-change: transform;
  line-height: 1;
}
#bg .deco.cloud   { font-size: clamp(46px, 9vw, 96px); opacity: 0.75; animation: drift linear infinite; }
#bg .deco.balloon { font-size: clamp(30px, 5vw, 54px); opacity: 0.8;  animation: sway ease-in-out infinite alternate; }
#bg .deco.spark   { font-size: clamp(18px, 3vw, 30px); opacity: 0.7;  animation: twinkle ease-in-out infinite; }
#bg .deco.bubble {
  border-radius: 50%;
  background: radial-gradient(circle at 32% 30%, rgba(255, 255, 255, 0.9), rgba(255, 255, 255, 0.25));
  border: 2px solid rgba(255, 255, 255, 0.65);
  animation: rise linear infinite;
}

@keyframes drift {
  from { transform: translateX(-18vw); }
  to   { transform: translateX(118vw); }
}
@keyframes sway {
  from { transform: translateY(0) rotate(-6deg); }
  to   { transform: translateY(34px) rotate(6deg); }
}
@keyframes twinkle {
  0%, 100% { transform: scale(0.7); opacity: 0.35; }
  50%      { transform: scale(1.2); opacity: 0.9; }
}
@keyframes rise {
  from { transform: translateY(0); }
  to   { transform: translateY(-115vh); }
}

/* ---------------- top bar ---------------- */

#topbar {
  position: sticky;
  top: 0;
  z-index: 40;
  display: flex;
  align-items: center;
  gap: 12px;
  padding: max(12px, env(safe-area-inset-top)) 16px 12px;
  max-width: 960px;
  margin: 0 auto;
  background: rgba(255, 255, 255, 0.55);
  backdrop-filter: blur(14px);
  -webkit-backdrop-filter: blur(14px);
  border-radius: 0 0 26px 26px;
  box-shadow: 0 8px 24px rgba(59, 59, 92, 0.12);
}

#title {
  flex: 1;
  text-align: center;
  font-size: clamp(20px, 4vw, 30px);
  font-weight: 900;
  margin: 0;
  text-shadow: 0 2px 0 rgba(255, 255, 255, 0.85);
}

.icon-btn {
  width: 54px;
  height: 54px;
  flex: 0 0 54px;
  border: none;
  border-radius: 50%;
  background: var(--paper);
  box-shadow: var(--shadow);
  font-size: 24px;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  position: relative;
  overflow: hidden;
  transition: transform 0.15s var(--spring);
}
.icon-btn:active { transform: translateY(4px) scale(0.96); box-shadow: 0 2px 0 rgba(59, 59, 92, 0.18); }

.icon-btn.holding::after {
  content: "";
  position: absolute;
  inset: 0;
  background: rgba(77, 150, 255, 0.4);
  animation: fillHold 3s linear forwards;
}
@keyframes fillHold { from { clip-path: inset(0 100% 0 0); } to { clip-path: inset(0 0 0 0); } }

/* ---------------- screens ---------------- */

#screen {
  position: relative;
  z-index: 1;
  padding-bottom: max(48px, env(safe-area-inset-bottom));
  max-width: 960px;
  margin: 0 auto;
}
#screen > * { animation: fadeInUp 0.4s var(--spring) both; }

@keyframes fadeInUp {
  from { opacity: 0; transform: translateY(22px); }
  to   { opacity: 1; transform: translateY(0); }
}

/* ---------------- home hero ---------------- */

.hero {
  display: flex;
  align-items: center;
  gap: 18px;
  padding: 20px 20px 6px;
  flex-wrap: wrap;
  justify-content: center;
}

.mascot-svg {
  width: clamp(110px, 24vw, 160px);
  height: auto;
  filter: drop-shadow(0 10px 18px rgba(59, 59, 92, 0.25));
  animation: bob 3s ease-in-out infinite;
}
@keyframes bob {
  0%, 100% { transform: translateY(0) rotate(-2deg); }
  50%      { transform: translateY(-12px) rotate(2deg); }
}

.hero-text { text-align: center; }
.hero-title {
  font-size: clamp(24px, 5vw, 36px);
  font-weight: 900;
  color: #fff;
  text-shadow: 0 3px 0 rgba(59, 59, 92, 0.28);
  line-height: 1.15;
}
.hero-sub {
  margin-top: 6px;
  font-size: clamp(15px, 3vw, 19px);
  font-weight: 800;
  color: rgba(255, 255, 255, 0.95);
  text-shadow: 0 2px 0 rgba(59, 59, 92, 0.2);
}

.mini-progress {
  display: flex;
  align-items: center;
  gap: 12px;
  width: min(460px, calc(100% - 40px));
  margin: 14px auto 4px;
  background: rgba(255, 255, 255, 0.75);
  border-radius: 999px;
  padding: 10px 18px;
  box-shadow: var(--shadow);
}
.mini-bar {
  flex: 1;
  height: 16px;
  border-radius: 999px;
  background: rgba(59, 59, 92, 0.15);
  overflow: hidden;
}
.mini-fill {
  height: 100%;
  border-radius: 999px;
  background: linear-gradient(90deg, #ffd93d, #ff9f43);
  box-shadow: inset 0 -3px 0 rgba(0, 0, 0, 0.12);
  transition: width 0.6s var(--spring);
}
.mini-progress .mini-label { font-weight: 900; font-size: 15px; white-space: nowrap; }

/* ---------------- mode tiles ---------------- */

.mode-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
  gap: 16px;
  max-width: 780px;
  margin: 18px auto 0;
  padding: 0 16px;
}

.mode-btn {
  border: none;
  cursor: pointer;
  border-radius: 28px;
  padding: 24px 12px 20px;
  color: #fff;
  font-weight: 900;
  font-size: 18px;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 9px;
  position: relative;
  overflow: hidden;
  text-shadow: 0 2px 0 rgba(0, 0, 0, 0.16);
  box-shadow: 0 10px 0 rgba(59, 59, 92, 0.22), 0 18px 30px rgba(59, 59, 92, 0.18);
  transition: transform 0.18s var(--spring), box-shadow 0.18s;
  animation: tileIn 0.5s var(--spring) both;
}
.mode-btn:nth-child(1) { background: linear-gradient(150deg, #4facfe, #00c2ff); animation-delay: 0.03s; }
.mode-btn:nth-child(2) { background: linear-gradient(150deg, #ff6b9d, #ff4d88); animation-delay: 0.09s; }
.mode-btn:nth-child(3) { background: linear-gradient(150deg, #43e97b, #14c98a); animation-delay: 0.15s; }
.mode-btn:nth-child(4) { background: linear-gradient(150deg, #ffa940, #ff7a1a); animation-delay: 0.21s; }
.mode-btn:nth-child(5) { background: linear-gradient(150deg, #a18cd1, #7c5cf0); animation-delay: 0.27s; }
.mode-btn:nth-child(6) { background: linear-gradient(150deg, #f6d365, #f59e0b); animation-delay: 0.33s; }
.mode-btn:nth-child(7) { background: linear-gradient(150deg, #00d2c1, #0ea5e9); animation-delay: 0.39s; }

.mode-btn::after {
  content: "";
  position: absolute;
  inset: 0;
  background: linear-gradient(180deg, rgba(255, 255, 255, 0.28), transparent 45%);
  pointer-events: none;
}

.mode-btn:hover { transform: translateY(-4px) scale(1.02); }
.mode-btn:active {
  transform: translateY(6px) scale(0.97);
  box-shadow: 0 3px 0 rgba(59, 59, 92, 0.22), 0 8px 16px rgba(59, 59, 92, 0.16);
}

.mode-btn .m-emoji {
  font-size: 54px;
  line-height: 1;
  filter: drop-shadow(0 5px 6px rgba(0, 0, 0, 0.22));
  animation: float 3s ease-in-out infinite;
}
.mode-btn:nth-child(2n) .m-emoji { animation-delay: 0.5s; }
.mode-btn:nth-child(3n) .m-emoji { animation-delay: 1s; }

@keyframes tileIn {
  from { opacity: 0; transform: translateY(30px) scale(0.85); }
  to   { opacity: 1; transform: translateY(0) scale(1); }
}

.badge {
  background: rgba(255, 255, 255, 0.95);
  color: var(--ink);
  border-radius: 999px;
  font-size: 13px;
  padding: 4px 13px;
  text-shadow: none;
  box-shadow: 0 3px 0 rgba(0, 0, 0, 0.15);
}

.parent-tip {
  text-align: center;
  font-size: 13px;
  font-weight: 700;
  color: rgba(255, 255, 255, 0.95);
  text-shadow: 0 2px 0 rgba(59, 59, 92, 0.25);
  margin-top: 26px;
  padding: 0 16px;
}

/* ---------------- shared cards ---------------- */

.grid {
  max-width: 900px;
  margin: 0 auto;
  padding: 18px 16px 0;
  display: grid;
  gap: 13px;
}

.card {
  background: var(--paper);
  border: none;
  border-radius: 24px;
  box-shadow: var(--shadow);
  min-height: 96px;
  cursor: pointer;
  font-weight: 900;
  color: var(--ink);
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 6px;
  padding: 12px 8px;
  font-size: 24px;
  position: relative;
  transition: transform 0.16s var(--spring), box-shadow 0.16s, background 0.15s;
}
.card:hover { transform: translateY(-3px); box-shadow: 0 10px 0 rgba(59, 59, 92, 0.16); }
.card:active { transform: scale(0.94); box-shadow: 0 3px 0 rgba(59, 59, 92, 0.18); }

.emoji-bubble {
  width: clamp(52px, 12vw, 68px);
  height: clamp(52px, 12vw, 68px);
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: clamp(30px, 7vw, 40px);
  background: var(--soft, #eef2ff);
  box-shadow: inset 0 -4px 0 rgba(59, 59, 92, 0.08);
}
.card .letter {
  font-size: clamp(22px, 5vw, 30px);
  line-height: 1;
  color: var(--accent, var(--ink));
}
.card .word { font-size: 13px; font-weight: 800; opacity: 0.6; }
.card .pair-emoji { font-size: clamp(34px, 9vw, 54px); line-height: 1.1; }
.card .lower { font-size: clamp(30px, 8vw, 44px); text-transform: lowercase; }

.card.right {
  background: var(--good);
  animation: pop 0.4s var(--spring);
  box-shadow: 0 0 0 5px rgba(107, 203, 119, 0.55), var(--shadow);
}

@keyframes pop {
  0%   { transform: scale(1); }
  45%  { transform: scale(1.14); }
  100% { transform: scale(1); }
}

/* ---------------- learn mode ---------------- */

.learn-grid { grid-template-columns: repeat(auto-fill, minmax(92px, 1fr)); }

.learn-card-wrap {
  min-width: 0;
  position: relative;
  padding-bottom: 44px;
}
.learn-card-wrap .learn-card {
  width: 100%;
}
.learn-card-speaker {
  position: absolute;
  right: 5px;
  bottom: 0;
  z-index: 2;
  width: 40px;
  height: 40px;
  padding: 0;
  border: 2px solid #fff;
  border-radius: 50%;
  background: rgba(255, 255, 255, 0.94);
  color: var(--ink);
  font-size: 18px;
  box-shadow: 0 3px 0 rgba(59, 59, 92, 0.16);
  cursor: pointer;
  touch-action: manipulation;
}
.learn-card-speaker:active { transform: scale(0.92); }

.learn-card { animation: bounceIn 0.5s var(--spring) both; }
.learn-card .emoji-bubble { animation: float 3.4s ease-in-out infinite; }

.overlay {
  position: fixed;
  inset: 0;
  background: rgba(45, 45, 74, 0.6);
  backdrop-filter: blur(4px);
  -webkit-backdrop-filter: blur(4px);
  display: flex;
  align-items: center;
  justify-content: center;
  z-index: 50;
  padding: 20px;
  animation: fadeIn 0.2s;
}

.popup {
  background: var(--paper);
  border-radius: 36px;
  padding: 34px 32px 28px;
  text-align: center;
  max-width: 430px;
  width: 100%;
  position: relative;
  box-shadow: 0 26px 70px rgba(25, 25, 50, 0.45);
  animation: bounceIn 0.45s var(--spring);
}

.close-btn {
  position: absolute;
  top: -16px;
  right: -16px;
  width: 58px;
  height: 58px;
  border: 4px solid #fff;
  border-radius: 50%;
  background: var(--pink);
  color: #fff;
  font-size: 24px;
  font-weight: 900;
  box-shadow: 0 6px 0 rgba(59, 59, 92, 0.25);
  cursor: pointer;
  transition: transform 0.15s var(--spring);
}
.close-btn:active { transform: translateY(5px) scale(0.95); }

.learn-popup { overflow: hidden; }

.learn-slider {
  width: 100%;
  overflow: hidden;
  touch-action: pan-y;
  perspective: 1000px;
}

.learn-slide {
  width: 100%;
  display: flex;
  justify-content: center;
  padding: 6px 0 4px;
}

.learn-slide.slide-out-left  { animation: learnSlideOutLeft 0.16s ease-in forwards; }
.learn-slide.slide-out-right { animation: learnSlideOutRight 0.16s ease-in forwards; }
.learn-slide.slide-in-left   { animation: learnSlideInLeft 0.22s var(--spring) both; }
.learn-slide.slide-in-right  { animation: learnSlideInRight 0.22s var(--spring) both; }

@keyframes learnSlideOutLeft {
  to { transform: translateX(-28%) scale(0.94); opacity: 0; }
}
@keyframes learnSlideOutRight {
  to { transform: translateX(28%) scale(0.94); opacity: 0; }
}
@keyframes learnSlideInLeft {
  from { transform: translateX(-28%) scale(0.94); opacity: 0; }
  to   { transform: translateX(0) scale(1); opacity: 1; }
}
@keyframes learnSlideInRight {
  from { transform: translateX(28%) scale(0.94); opacity: 0; }
  to   { transform: translateX(0) scale(1); opacity: 1; }
}

.flip-card {
  width: min(100%, 300px);
  height: clamp(280px, 68vw, 360px);
  border: 0;
  padding: 0;
  background: transparent;
  cursor: pointer;
  perspective: 1200px;
  -webkit-tap-highlight-color: transparent;
}
.flip-inner {
  position: relative;
  display: block;
  width: 100%;
  height: 100%;
  transform-style: preserve-3d;
  transition: transform 0.55s var(--spring);
}
.flip-card.is-flipped .flip-inner { transform: rotateY(180deg); }

.flip-face {
  position: absolute;
  inset: 0;
  border-radius: 28px;
  backface-visibility: hidden;
  -webkit-backface-visibility: hidden;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 10px;
  box-shadow: 0 14px 0 rgba(59, 59, 92, 0.14), 0 18px 36px rgba(59, 59, 92, 0.16);
}

.flip-front {
  background:
    radial-gradient(circle at 30% 24%, #ffffff, var(--soft, #ffe4ee) 70%),
    linear-gradient(160deg, var(--soft, #ffe4ee), #fff);
  border: 4px solid rgba(255, 255, 255, 0.95);
  outline: 3px solid var(--accent, var(--pink));
  outline-offset: -6px;
}

.flip-back {
  background: linear-gradient(165deg, #fff 0%, var(--soft, #ffe4ee) 100%);
  border: 4px solid var(--accent, var(--pink));
  transform: rotateY(180deg);
}

.flip-cue {
  font-size: 13px;
  font-weight: 800;
  color: rgba(59, 59, 92, 0.55);
  letter-spacing: 0.02em;
}

.learn-phonics {
  display: inline-block;
  font-size: clamp(18px, 4.4vw, 24px);
  font-weight: 900;
  color: var(--accent, var(--pink));
  background: rgba(255, 255, 255, 0.85);
  padding: 6px 16px;
  border-radius: 999px;
  box-shadow: 0 4px 0 rgba(59, 59, 92, 0.12);
}

.learn-phonics-back {
  margin-top: 2px;
  font-size: clamp(14px, 3.4vw, 17px);
  font-weight: 800;
  color: rgba(59, 59, 92, 0.7);
}

.learn-emoji {
  width: clamp(96px, 26vw, 140px);
  height: clamp(96px, 26vw, 140px);
  margin: 0 auto;
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: clamp(56px, 15vw, 88px);
  background: radial-gradient(circle at 32% 26%, #fff, var(--soft, #ffe4ee));
  box-shadow: inset 0 -8px 0 rgba(59, 59, 92, 0.07), 0 10px 24px rgba(59, 59, 92, 0.14);
  animation: bob 2.6s ease-in-out infinite;
  flex-shrink: 0;
}

.flip-front .learn-emoji-front {
  width: clamp(100px, 28vw, 148px);
  height: clamp(100px, 28vw, 148px);
  font-size: clamp(60px, 16vw, 96px);
}

.flip-back .learn-emoji-back {
  width: clamp(120px, 32vw, 168px);
  height: clamp(120px, 32vw, 168px);
  font-size: clamp(72px, 19vw, 112px);
}

.learn-letter {
  font-size: clamp(56px, 14vw, 84px);
  font-weight: 900;
  line-height: 1;
  margin-top: 0;
  background: linear-gradient(135deg, #ff6b9d 0%, #ff9f43 30%, #ffd93d 55%, #6bcb77 80%, #4d96ff 100%);
  -webkit-background-clip: text;
  background-clip: text;
  color: transparent;
  filter: drop-shadow(0 5px 0 rgba(59, 59, 92, 0.15));
}

.learn-word {
  display: inline-block;
  margin-top: 4px;
  font-size: clamp(22px, 5vw, 30px);
  font-weight: 900;
  color: #fff;
  background: var(--accent, var(--pink));
  padding: 7px 24px;
  border-radius: 999px;
  box-shadow: 0 5px 0 rgba(59, 59, 92, 0.18);
}

.learn-nav {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  margin: 20px auto 0;
  max-width: 260px;
}
.learn-nav-btn {
  flex: 0 0 48px;
  width: 48px;
  height: 48px;
  padding: 0;
  border: 0;
  border-radius: 50%;
  background: var(--accent, var(--pink));
  color: #fff;
  font-size: 26px;
  font-weight: 900;
  box-shadow: 0 5px 0 rgba(59, 59, 92, 0.2);
  cursor: pointer;
  touch-action: manipulation;
}
.learn-nav-btn:active:not(:disabled) { transform: translateY(3px); }
.learn-nav-btn:disabled {
  opacity: 0.4;
  box-shadow: none;
  cursor: not-allowed;
}
.learn-nav-counter {
  min-width: 76px;
  color: var(--ink);
  font-size: 14px;
  font-weight: 900;
  text-align: center;
  white-space: nowrap;
}

.hint {
  margin-top: 14px;
  font-size: 14px;
  font-weight: 800;
  color: rgba(59, 59, 92, 0.6);
  animation: twinkle 1.8s ease-in-out infinite;
}

/* ---------------- find it ---------------- */

.find-wrap {
  max-width: 780px;
  margin: 0 auto;
  padding: 16px 16px 0;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 20px;
}

.ask-row {
  display: flex;
  align-items: flex-start;
  gap: 12px;
  width: 100%;
  justify-content: center;
}

.ask-avatar {
  width: clamp(56px, 13vw, 74px);
  height: clamp(56px, 13vw, 74px);
  flex: 0 0 auto;
  border-radius: 50%;
  background: radial-gradient(circle at 32% 26%, #fff, #ffe4ee);
  border: 4px solid #fff;
  box-shadow: var(--shadow);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: clamp(30px, 7vw, 42px);
  animation: bob 2.8s ease-in-out infinite;
}

.speech-bubble {
  position: relative;
  background: var(--paper);
  border-radius: 24px;
  padding: 14px 18px;
  box-shadow: var(--shadow);
  display: flex;
  align-items: center;
  gap: 14px;
  flex-wrap: wrap;
  justify-content: center;
  max-width: 480px;
}
.speech-bubble::before {
  content: "";
  position: absolute;
  left: -11px;
  top: 20px;
  border: 11px solid transparent;
  border-right-color: var(--paper);
}

.prompt-text {
  font-size: clamp(18px, 4vw, 26px);
  font-weight: 900;
}

.repeat-btn {
  width: 60px;
  height: 60px;
  flex: 0 0 60px;
  border: none;
  border-radius: 50%;
  background: linear-gradient(150deg, #4facfe, #00c2ff);
  color: #fff;
  font-size: 27px;
  cursor: pointer;
  box-shadow: 0 6px 0 rgba(59, 59, 92, 0.28);
  transition: transform 0.15s var(--spring);
}
.repeat-btn:active { transform: translateY(5px) scale(0.95); box-shadow: 0 1px 0 rgba(59, 59, 92, 0.28); }
.repeat-btn.small { width: 52px; height: 52px; flex-basis: 52px; font-size: 23px; }

.choice-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(126px, 1fr));
  gap: 15px;
  width: 100%;
}
.choice-grid .card { min-height: 158px; }

/* ---------------- level stars ---------------- */

.level-stars { display: flex; gap: 7px; align-items: center; }
.level-stars .star {
  font-size: 24px;
  line-height: 1;
  filter: grayscale(1) opacity(0.45);
  transition: transform 0.3s var(--spring);
}
.level-stars .star.on {
  filter: none;
  animation: twinkle 1.6s ease-in-out infinite;
}
.level-stars .star.on:nth-child(2) { animation-delay: 0.25s; }
.level-stars .star.on:nth-child(3) { animation-delay: 0.5s; }
.level-stars .star.on:nth-child(4) { animation-delay: 0.75s; }

/* ---------------- matching games ---------------- */

.match-wrap {
  max-width: 760px;
  margin: 0 auto;
  padding: 16px 16px 0;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 18px;
}

.match-head { display: flex; align-items: center; gap: 16px; justify-content: center; }

.match-board {
  display: flex;
  gap: clamp(14px, 5vw, 34px);
  justify-content: center;
  width: 100%;
}

.match-col-wrap {
  flex: 1;
  max-width: 250px;
  display: flex;
  flex-direction: column;
  gap: 10px;
  background: rgba(255, 255, 255, 0.42);
  border: 3px solid rgba(255, 255, 255, 0.75);
  border-radius: 28px;
  padding: 14px 14px 16px;
  backdrop-filter: blur(6px);
  -webkit-backdrop-filter: blur(6px);
  box-shadow: 0 10px 26px rgba(59, 59, 92, 0.12);
}

.col-chip {
  align-self: center;
  font-size: 26px;
  background: var(--paper);
  border-radius: 999px;
  padding: 6px 18px;
  box-shadow: var(--shadow);
  animation: pop 0.4s var(--spring);
}

.match-col { display: flex; flex-direction: column; gap: 12px; }
.match-col .card { min-height: 82px; font-size: 34px; }

.match-col .card.selected {
  background: var(--yellow);
  transform: scale(1.06) rotate(-1.5deg);
  box-shadow: 0 0 0 5px rgba(255, 217, 61, 0.55), var(--shadow);
}

.match-col .card.matched {
  background: var(--good);
  opacity: 0.85;
  box-shadow: none;
  transform: none;
  pointer-events: none;
  position: relative;
}
.match-col .card.matched::after {
  content: "✅";
  position: absolute;
  top: 6px;
  right: 8px;
  font-size: 18px;
  animation: pop 0.4s var(--spring);
}

/* ---------------- memory ---------------- */

.mem-wrap {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 18px;
  padding: 16px 16px 0;
}

.memory-grid {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 13px;
  max-width: 490px;
  width: 100%;
}

.mem-card {
  position: relative;
  aspect-ratio: 1;
  min-height: 68px;
  border: none;
  background: transparent;
  cursor: pointer;
  padding: 0;
  perspective: 750px;
  transform: rotate(var(--rot, 0deg));
  transition: transform 0.2s var(--spring);
}
.mem-card:active { transform: rotate(var(--rot, 0deg)) scale(0.94); }

.mem-inner {
  position: absolute;
  inset: 0;
  transform-style: preserve-3d;
  transition: transform 0.4s var(--spring);
}
.mem-card.flipped .mem-inner,
.mem-card.done .mem-inner { transform: rotateY(180deg); }

.mem-face {
  position: absolute;
  inset: 0;
  backface-visibility: hidden;
  -webkit-backface-visibility: hidden;
  border-radius: 20px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-weight: 900;
  box-shadow: var(--shadow);
}

.mem-back {
  background:
    radial-gradient(circle at 22% 28%, rgba(255, 255, 255, 0.35) 0 14%, transparent 15%),
    radial-gradient(circle at 74% 64%, rgba(255, 255, 255, 0.3) 0 12%, transparent 13%),
    linear-gradient(140deg, #a18cd1, #6d5ef0);
  color: #fff;
  font-size: clamp(26px, 7vw, 38px);
  border: 3px solid rgba(255, 255, 255, 0.65);
}

.mem-front {
  background: var(--paper);
  transform: rotateY(180deg);
  font-size: clamp(28px, 8vw, 46px);
  border: 3px solid #fff;
}

.mem-card.done { pointer-events: none; }
.mem-card.done .mem-front { background: var(--good); border-color: #b7ecc8; }
.mem-card.done { animation: pop 0.4s var(--spring); }

/* ---------------- sticker book ---------------- */

.sticker-wrap {
  max-width: 880px;
  margin: 0 auto;
  padding: 16px 16px 0;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 20px;
}

.progress-wrap {
  width: min(480px, 100%);
  background: rgba(255, 255, 255, 0.8);
  border-radius: 999px;
  padding: 12px 20px;
  box-shadow: var(--shadow);
  display: flex;
  flex-direction: column;
  gap: 8px;
}
.progress-bar {
  height: 20px;
  border-radius: 999px;
  background: rgba(59, 59, 92, 0.15);
  overflow: hidden;
  box-shadow: inset 0 3px 5px rgba(59, 59, 92, 0.18);
}
.progress-fill {
  height: 100%;
  border-radius: 999px;
  background: linear-gradient(90deg, #ffd93d, #ff9f43, #ff6b9d);
  background-size: 200% 100%;
  animation: shimmer 2.4s linear infinite;
  box-shadow: inset 0 -4px 0 rgba(0, 0, 0, 0.12);
  transition: width 0.7s var(--spring);
}
@keyframes shimmer { to { background-position: 200% 0; } }
.progress-label { text-align: center; font-weight: 900; font-size: clamp(16px, 4vw, 20px); }

.sticker-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(84px, 1fr));
  gap: 14px;
  width: 100%;
}

.sticker {
  border: 4px solid var(--accent, #ffd93d);
  border-radius: 50%;
  aspect-ratio: 1;
  background: radial-gradient(circle at 32% 26%, #fff, var(--soft, #fff7dd));
  box-shadow: 0 7px 0 rgba(59, 59, 92, 0.16), 0 14px 22px rgba(59, 59, 92, 0.12);
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 1px;
  cursor: pointer;
  font-weight: 900;
  min-height: 84px;
  padding: 6px;
  transition: transform 0.18s var(--spring);
}
.sticker:hover { transform: translateY(-4px) rotate(-3deg); }
.sticker:active { transform: scale(0.92); }
.sticker .s-emoji { font-size: clamp(30px, 7vw, 40px); line-height: 1; }
.sticker .s-letter { font-size: 15px; color: var(--accent, var(--ink)); }

.sticker.locked {
  border-style: dashed;
  border-color: rgba(59, 59, 92, 0.3);
  background: rgba(255, 255, 255, 0.4);
  color: rgba(59, 59, 92, 0.45);
  cursor: default;
  box-shadow: none;
}
.sticker.locked .s-emoji { filter: grayscale(1); opacity: 0.3; }
.sticker.locked .s-letter { color: rgba(59, 59, 92, 0.45); }
.sticker.locked::after {
  content: "🔒";
  position: absolute;
  font-size: 14px;
  transform: translate(26px, -24px);
}
.sticker { position: relative; }

/* ---------------- poems ---------------- */

.poem-list {
  max-width: 640px;
  margin: 0 auto;
  padding: 18px 16px 0;
  display: flex;
  flex-direction: column;
  gap: 15px;
}

.poem-card {
  border: none;
  border-radius: 26px;
  padding: 18px 22px;
  display: flex;
  align-items: center;
  gap: 16px;
  cursor: pointer;
  color: #fff;
  font-weight: 900;
  text-align: left;
  position: relative;
  overflow: hidden;
  background: var(--accent, #4d96ff);
  box-shadow: 0 10px 0 rgba(59, 59, 92, 0.22), 0 16px 28px rgba(59, 59, 92, 0.16);
  text-shadow: 0 2px 0 rgba(0, 0, 0, 0.18);
  transition: transform 0.18s var(--spring), box-shadow 0.18s;
  animation: tileIn 0.5s var(--spring) both;
}
.poem-card:nth-child(1) { animation-delay: 0.03s; }
.poem-card:nth-child(2) { animation-delay: 0.1s; }
.poem-card:nth-child(3) { animation-delay: 0.17s; }
.poem-card:nth-child(4) { animation-delay: 0.24s; }

.poem-card::after {
  content: "";
  position: absolute;
  inset: 0;
  background: linear-gradient(180deg, rgba(255, 255, 255, 0.28), transparent 52%);
  pointer-events: none;
}

.poem-card:hover { transform: translateY(-4px); }
.poem-card:active {
  transform: translateY(6px) scale(0.98);
  box-shadow: 0 3px 0 rgba(59, 59, 92, 0.22), 0 8px 16px rgba(59, 59, 92, 0.14);
}

.poem-emoji {
  font-size: 42px;
  line-height: 1;
  filter: drop-shadow(0 4px 5px rgba(0, 0, 0, 0.28));
  animation: float 3s ease-in-out infinite;
}
.poem-texts { display: flex; flex-direction: column; gap: 4px; }
.poem-title { font-size: clamp(17px, 4vw, 23px); line-height: 1.15; }
.poem-meta { font-size: 13px; font-weight: 700; opacity: 0.92; text-shadow: none; }

/* --- poem reader --- */

.poem-reader {
  max-width: 680px;
  margin: 0 auto;
  padding: 16px 16px 0;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 16px;
}

.reader-head {
  display: flex;
  align-items: center;
  gap: 14px;
  justify-content: center;
  flex-wrap: wrap;
}

.reader-title {
  background: rgba(255, 255, 255, 0.88);
  padding: 11px 24px;
  border-radius: 999px;
  font-weight: 900;
  font-size: clamp(16px, 4vw, 22px);
  box-shadow: var(--shadow);
}

.poem-lines { display: flex; flex-direction: column; gap: 9px; width: 100%; }

.poem-line {
  background: rgba(255, 255, 255, 0.78);
  border: 3px solid rgba(255, 255, 255, 0.92);
  border-radius: 18px;
  padding: 11px 16px;
  font-size: clamp(17px, 4.2vw, 24px);
  font-weight: 800;
  text-align: center;
  cursor: pointer;
  box-shadow: 0 4px 0 rgba(59, 59, 92, 0.12);
  transition: background 0.25s, transform 0.25s var(--spring), box-shadow 0.25s;
}
.poem-line:hover { transform: translateY(-2px); }
.poem-line.active {
  background: var(--yellow);
  border-color: #fff;
  transform: scale(1.035);
  box-shadow: 0 7px 0 rgba(59, 59, 92, 0.18);
}

.reader-hint {
  font-size: 14px;
  font-weight: 800;
  color: rgba(255, 255, 255, 0.96);
  text-shadow: 0 2px 0 rgba(59, 59, 92, 0.28);
  text-align: center;
  padding: 0 8px;
}

/* ---------------- profile picker ---------------- */

.profile-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(135px, 1fr));
  gap: 16px;
  max-width: 680px;
  margin: 0 auto;
  padding: 22px 16px 0;
}

.profile-card {
  border: none;
  border-radius: 28px;
  background: rgba(255, 255, 255, 0.92);
  box-shadow: var(--shadow);
  padding: 24px 10px 18px;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 9px;
  cursor: pointer;
  font-weight: 900;
  font-size: 17px;
  color: var(--ink);
  transition: transform 0.18s var(--spring), box-shadow 0.18s;
  animation: tileIn 0.5s var(--spring) both;
}
.profile-card:hover { transform: translateY(-5px); }
.profile-card:active {
  transform: translateY(5px) scale(0.97);
  box-shadow: 0 3px 0 rgba(59, 59, 92, 0.18);
}

.profile-card .p-avatar {
  font-size: 52px;
  line-height: 1;
  filter: drop-shadow(0 5px 6px rgba(0, 0, 0, 0.2));
}

.profile-card.add {
  background: rgba(255, 255, 255, 0.4);
  border: 4px dashed rgba(255, 255, 255, 0.95);
  color: #fff;
  text-shadow: 0 2px 0 rgba(59, 59, 92, 0.25);
}
.profile-card.guest { background: rgba(255, 255, 255, 0.66); }

.profile-hint {
  text-align: center;
  font-weight: 800;
  font-size: 14px;
  color: rgba(255, 255, 255, 0.96);
  text-shadow: 0 2px 0 rgba(59, 59, 92, 0.25);
  padding: 18px 16px;
}

/* create-profile modal */

.name-input {
  border: 3px solid #e4e4f0;
  border-radius: 16px;
  padding: 14px 16px;
  font-size: 19px;
  font-weight: 800;
  width: 100%;
  text-align: center;
  font-family: inherit;
  color: var(--ink);
  background: #fafaff;
}
.name-input:focus { outline: none; border-color: var(--blue); background: #fff; }
.name-input.wobble { animation: wobble 0.5s; }

.avatar-picker {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 10px;
}
.avatar-opt {
  border: 3px solid transparent;
  border-radius: 16px;
  background: #f2f3fa;
  font-size: 30px;
  padding: 9px 4px;
  cursor: pointer;
  transition: transform 0.15s var(--spring), background 0.15s, border-color 0.15s;
}
.avatar-opt:active { transform: scale(0.9); }
.avatar-opt.sel {
  border-color: var(--blue);
  background: #e3efff;
  transform: scale(1.1);
  box-shadow: 0 4px 0 rgba(59, 59, 92, 0.15);
}

/* ---------------- sidebar ---------------- */

.sidebar-overlay {
  position: fixed;
  inset: 0;
  background: rgba(20, 20, 40, 0.45);
  backdrop-filter: blur(3px);
  z-index: 50;
  transition: opacity 0.25s;
}
.sidebar-overlay.hidden { opacity: 0; pointer-events: none; }

.sidebar {
  position: fixed;
  top: 0;
  left: 0;
  bottom: 0;
  width: 280px;
  max-width: 82vw;
  background: linear-gradient(180deg, #ffffff 0%, #f3f4ff 100%);
  box-shadow: 6px 0 30px rgba(59, 59, 92, 0.25);
  z-index: 60;
  display: flex;
  flex-direction: column;
  padding: 0;
  transform: translateX(-100%);
  transition: transform 0.3s var(--spring);
  border-radius: 0 28px 28px 0;
  overflow-y: auto;
}
.sidebar:not(.hidden) { transform: translateX(0); }

.sidebar-header {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 22px 18px 16px;
  background: linear-gradient(135deg, #6c5ce7, #a29bfe);
  color: #fff;
  border-radius: 0 0 0 0;
}
.sidebar-avatar {
  font-size: 46px;
  line-height: 1;
  filter: drop-shadow(0 4px 6px rgba(0,0,0,0.25));
}
.sidebar-user { flex: 1; display: flex; flex-direction: column; gap: 2px; }
.sidebar-name { font-size: 20px; font-weight: 900; }
.sidebar-status { font-size: 12px; font-weight: 700; opacity: 0.9; }
.sidebar-close {
  background: rgba(255,255,255,0.25);
  border: none;
  color: #fff;
  width: 34px;
  height: 34px;
  border-radius: 50%;
  font-size: 18px;
  font-weight: 900;
  cursor: pointer;
  display: grid;
  place-items: center;
}
.sidebar-close:active { transform: scale(0.9); }

.sidebar-nav {
  display: flex;
  flex-direction: column;
  gap: 6px;
  padding: 16px 12px 8px;
}
.sidebar-link {
  border: none;
  background: transparent;
  text-align: left;
  padding: 14px 16px;
  font-size: 17px;
  font-weight: 800;
  color: var(--ink);
  border-radius: 16px;
  cursor: pointer;
  transition: background 0.15s, transform 0.15s;
  display: flex;
  align-items: center;
  gap: 10px;
}
.sidebar-link:hover { background: rgba(108, 92, 231, 0.1); }
.sidebar-link:active { transform: scale(0.97); background: rgba(108, 92, 231, 0.18); }

.sidebar-actions {
  display: flex;
  flex-direction: column;
  gap: 8px;
  padding: 12px 12px 24px;
  margin-top: auto;
  border-top: 2px solid rgba(108, 92, 231, 0.1);
}
.sidebar-btn {
  border: none;
  background: rgba(108, 92, 231, 0.08);
  color: var(--ink);
  padding: 13px 16px;
  font-size: 15px;
  font-weight: 800;
  border-radius: 16px;
  cursor: pointer;
  text-align: left;
  transition: transform 0.15s, background 0.15s;
}
.sidebar-btn:active { transform: scale(0.97); }
.sidebar-btn.warn { background: rgba(255, 82, 82, 0.12); color: #c0392b; }
.sidebar-btn.hidden { display: none; }

/* ---------------- auth (login / signup) ---------------- */

.auth-wrap {
  display: flex;
  justify-content: center;
  padding: 20px 16px;
}

.auth-box {
  background: rgba(255, 255, 255, 0.95);
  border-radius: 28px;
  padding: 30px 24px;
  max-width: 420px;
  width: 100%;
  box-shadow: var(--shadow);
  display: flex;
  flex-direction: column;
  gap: 14px;
  animation: tileIn 0.5s var(--spring) both;
}

.auth-box h2 {
  text-align: center;
  font-size: 24px;
  margin: 0 0 6px;
  color: var(--ink);
}

.auth-input {
  border: 3px solid #e4e4f0;
  border-radius: 16px;
  padding: 14px 16px;
  font-size: 17px;
  font-weight: 700;
  width: 100%;
  font-family: inherit;
  color: var(--ink);
  background: #fafaff;
  transition: border-color 0.15s, background 0.15s;
}
.auth-input:focus { outline: none; border-color: var(--blue); background: #fff; }

.auth-submit {
  width: 100%;
  padding: 16px;
  font-size: 18px;
  margin-top: 4px;
}

.auth-guest {
  width: 100%;
  background: rgba(108, 92, 231, 0.08);
}

.auth-switch {
  text-align: center;
  font-size: 14px;
  font-weight: 700;
  color: var(--ink);
  opacity: 0.8;
  margin: 0;
}
.auth-switch a {
  color: var(--blue);
  text-decoration: none;
  font-weight: 900;
}
.auth-switch a:hover { text-decoration: underline; }

/* ---------------- coloring ---------------- */

.coloring-wrap {
  display: flex;
  flex-direction: column;
  gap: 16px;
  padding: 10px 12px 24px;
  max-width: 720px;
  margin: 0 auto;
}

.color-palette {
  display: flex;
  flex-wrap: wrap;
  gap: 10px;
  justify-content: center;
  padding: 12px;
  background: rgba(255, 255, 255, 0.85);
  border-radius: 20px;
  box-shadow: var(--shadow);
}

.color-swatch {
  width: 44px;
  height: 44px;
  border-radius: 50%;
  border: 4px solid transparent;
  cursor: pointer;
  transition: transform 0.15s var(--spring), border-color 0.15s;
  box-shadow: 0 3px 0 rgba(59, 59, 92, 0.15);
}
.color-swatch:active { transform: scale(0.9); }
.color-swatch.sel {
  border-color: var(--ink);
  transform: scale(1.15);
  box-shadow: 0 4px 0 rgba(59, 59, 92, 0.25);
}

.coloring-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));
  gap: 14px;
}

.coloring-card {
  background: rgba(255, 255, 255, 0.9);
  border-radius: 22px;
  padding: 16px 8px;
  text-align: center;
  box-shadow: var(--shadow);
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 8px;
  animation: tileIn 0.5s var(--spring) both;
}

.coloring-emoji {
  font-size: 64px;
  line-height: 1;
  cursor: pointer;
  transition: transform 0.15s, background 0.2s;
  border-radius: 50%;
  padding: 8px;
}
.coloring-emoji:active { transform: scale(0.9); }

.coloring-name {
  font-size: 15px;
  font-weight: 900;
  color: var(--ink);
}

.coloring-hint {
  text-align: center;
  font-size: 14px;
  font-weight: 800;
  color: rgba(255, 255, 255, 0.96);
  text-shadow: 0 2px 0 rgba(59, 59, 92, 0.25);
  padding: 8px;
}

/* ---------------- profile view ---------------- */

.profile-view {
  display: flex;
  flex-direction: column;
  gap: 16px;
  padding: 10px 12px 24px;
  max-width: 480px;
  margin: 0 auto;
}

.profile-card-view {
  background: linear-gradient(135deg, #6c5ce7, #a29bfe);
  border-radius: 28px;
  padding: 30px 20px;
  text-align: center;
  color: #fff;
  box-shadow: var(--shadow);
  animation: tileIn 0.5s var(--spring) both;
}

.pv-avatar { font-size: 72px; line-height: 1; margin-bottom: 8px; }
.pv-name { font-size: 26px; font-weight: 900; margin-bottom: 4px; }
.pv-email { font-size: 14px; opacity: 0.9; margin-bottom: 4px; }
.pv-joined { font-size: 13px; opacity: 0.8; }

.forgot-result {
  background: rgba(108, 92, 231, 0.1);
  border-radius: 16px;
  padding: 14px;
  margin-top: 8px;
}

.auth-remember {
  display: flex;
  align-items: center;
  gap: 8px;
  font-size: 14px;
  font-weight: 700;
  color: var(--ink);
  cursor: pointer;
}
.auth-remember input { width: 18px; height: 18px; }

/* ---------------- fruits & vegetables ---------------- */

.fv-wrap {
  padding: 10px 12px 24px;
  max-width: 720px;
  margin: 0 auto;
}

.fv-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(110px, 1fr));
  gap: 14px;
}

.fv-card {
  background: rgba(255, 255, 255, 0.92);
  border: none;
  border-radius: 22px;
  padding: 16px 8px;
  text-align: center;
  box-shadow: var(--shadow);
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 6px;
  cursor: pointer;
  transition: transform 0.18s var(--spring);
  animation: tileIn 0.5s var(--spring) both;
}
.fv-card:hover { transform: translateY(-4px); }
.fv-card:active { transform: scale(0.95); }

.fv-emoji { font-size: 52px; line-height: 1; }
.fv-name { font-size: 15px; font-weight: 900; color: var(--ink); }

/* ---------------- colors ---------------- */

.colors-wrap {
  padding: 10px 12px 24px;
  max-width: 720px;
  margin: 0 auto;
}

.colors-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));
  gap: 14px;
}

.color-card {
  background: rgba(255, 255, 255, 0.92);
  border: none;
  border-radius: 22px;
  padding: 16px 8px;
  text-align: center;
  box-shadow: var(--shadow);
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 6px;
  cursor: pointer;
  transition: transform 0.18s var(--spring);
  animation: tileIn 0.5s var(--spring) both;
}
.color-card:hover { transform: translateY(-4px); }
.color-card:active { transform: scale(0.95); }

.color-swatch-big {
  width: 60px;
  height: 60px;
  border-radius: 50%;
  border: 4px solid rgba(59, 59, 92, 0.15);
  box-shadow: 0 4px 0 rgba(59, 59, 92, 0.12);
}
.color-name { font-size: 16px; font-weight: 900; color: var(--ink); }
.color-emoji { font-size: 24px; }

/* ---------------- fx: confetti + toasts ---------------- */

#fx {
  position: fixed;
  inset: 0;
  pointer-events: none;
  z-index: 100;
  overflow: hidden;
}

.confetti {
  position: absolute;
  top: -26px;
  width: 14px;
  height: 14px;
  border-radius: 3px;
  animation: fall linear forwards;
}
.confetti.emoji {
  background: none !important;
  border-radius: 0;
  font-size: 24px;
  width: auto;
  height: auto;
}
@keyframes fall {
  to { transform: translateY(112vh) rotate(760deg); opacity: 0.85; }
}

.toast {
  position: absolute;
  left: 50%;
  top: 15%;
  transform: translateX(-50%);
  background: var(--paper);
  border: 4px solid var(--yellow);
  padding: 14px 28px;
  border-radius: 999px;
  font-weight: 900;
  font-size: clamp(18px, 4vw, 26px);
  box-shadow: 0 14px 38px rgba(0, 0, 0, 0.3);
  white-space: nowrap;
  animation: toastPop 1.5s var(--spring) both;
}
@keyframes toastPop {
  0%   { transform: translateX(-50%) scale(0.3); opacity: 0; }
  14%  { transform: translateX(-50%) scale(1.1); opacity: 1; }
  24%  { transform: translateX(-50%) scale(1); opacity: 1; }
  80%  { transform: translateX(-50%) scale(1); opacity: 1; }
  100% { transform: translateX(-50%) scale(0.94); opacity: 0; }
}

/* ---------------- parent modal ---------------- */

.modal {
  position: fixed;
  inset: 0;
  background: rgba(30, 30, 50, 0.55);
  z-index: 60;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 20px;
}

.modal-box {
  background: var(--paper);
  border-radius: 30px;
  padding: 28px;
  max-width: 400px;
  width: 100%;
  display: flex;
  flex-direction: column;
  gap: 14px;
  box-shadow: 0 24px 70px rgba(0, 0, 0, 0.4);
  animation: bounceIn 0.4s var(--spring);
}
.modal-box h2 { margin: 0; font-size: 24px; font-weight: 900; }
.modal-note { margin: 0; font-size: 14px; opacity: 0.7; }

.p-btn {
  border: none;
  border-radius: 18px;
  padding: 17px;
  font-size: 17px;
  font-weight: 900;
  cursor: pointer;
  box-shadow: var(--shadow);
  background: var(--blue);
  color: #fff;
  transition: transform 0.15s var(--spring);
}
.p-btn:active { transform: translateY(5px); box-shadow: 0 2px 0 rgba(59, 59, 92, 0.18); }
.p-btn.warn { background: var(--pink); }
.p-btn.plain { background: #ececf4; color: var(--ink); }

/* ---------------- shared animations ---------------- */

@keyframes bounceIn {
  0%   { transform: scale(0.3); opacity: 0; }
  60%  { transform: scale(1.07); opacity: 1; }
  80%  { transform: scale(0.96); }
  100% { transform: scale(1); opacity: 1; }
}

@keyframes wobble {
  0%, 100% { transform: translateX(0); }
  20% { transform: translateX(-9px) rotate(-3deg); }
  40% { transform: translateX(8px) rotate(3deg); }
  60% { transform: translateX(-6px) rotate(-2deg); }
  80% { transform: translateX(5px) rotate(2deg); }
}

.card.wobble, .sticker.wobble { animation: wobble 0.5s; }

@keyframes float {
  0%, 100% { transform: translateY(0); }
  50% { transform: translateY(-8px); }
}

@keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

/* ---------------- small screens ---------------- */

@media (max-width: 430px) {
  #topbar { gap: 8px; padding-left: 12px; padding-right: 12px; }
  .icon-btn { width: 48px; height: 48px; flex-basis: 48px; font-size: 21px; }

  .memory-grid { gap: 9px; }
  .speech-bubble::before { top: 16px; }
  .sticker-grid { gap: 11px; }
}

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: 0.01ms !important; animation-iteration-count: 1 !important; transition-duration: 0.01ms !important; }
}

/* ============================================================
   Lumacubs — game engine
   Modes: Learn, Find It, Picture Match, Letter Match, Memory
   ============================================================ */

(function () {
  "use strict";

  /* ------------------------------ storage ------------------------------ */

  const LS = {
    get(k, d) {
      try { const r = localStorage.getItem("mad:" + k); return r == null ? d : JSON.parse(r); }
      catch (e) { return d; }
    },
    set(k, v) {
      try { localStorage.setItem("mad:" + k, JSON.stringify(v)); } catch (e) {}
      scheduleSave();
    },
    del(k) { try { localStorage.removeItem("mad:" + k); } catch (e) {} },
  };

  /* ------------------------- server API (MariaDB) ------------------------- */

  const API_URL = "api.php";
  let serverMode = false;
  let activeProfile = null;
  let saveTimer = null;

  async function apiCall(action, params, method) {
    let url = API_URL + "?action=" + encodeURIComponent(action);
    const opts = { method: method || "GET" };
    if (method === "POST" && params) {
      opts.headers = { "Content-Type": "application/x-www-form-urlencoded" };
      opts.body = new URLSearchParams(params).toString();
    } else if (params) {
      url += "&" + new URLSearchParams(params).toString();
    }
    const ctrl = typeof AbortController !== "undefined" ? new AbortController() : null;
    if (ctrl) {
      opts.signal = ctrl.signal;
      setTimeout(() => ctrl.abort(), 4000);
    }
    try {
      const res = await fetch(url, opts);
      if (!res.ok) return null;
      return await res.json();
    } catch (e) {
      return null;
    }
  }

  function scheduleSave() {
    if (!serverMode || !activeProfile) return;
    if (saveTimer) clearTimeout(saveTimer);
    saveTimer = setTimeout(saveNow, 700);
  }

  async function saveNow() {
    if (saveTimer) { clearTimeout(saveTimer); saveTimer = null; }
    if (!serverMode || !activeProfile) return;
    await apiCall("save", {
      id: activeProfile.id,
      stickers: JSON.stringify(stickers),
      levels: JSON.stringify(levels),
      speech_on: speechOn ? 1 : 0,
    }, "POST");
  }

  let stickers = LS.get("stickers", {});
  let speechOn = LS.get("speechOn", true);
  let levels = LS.get("levels", {});

  /* ------------------------------ helpers ------------------------------ */

  const $ = (s, r) => (r || document).querySelector(s);

  function el(tag, cls, html) {
    const n = document.createElement(tag);
    if (cls) n.className = cls;
    if (html != null) n.innerHTML = html;
    return n;
  }

  function shuffle(a) {
    a = a.slice();
    for (let i = a.length - 1; i > 0; i--) {
      const j = (Math.random() * (i + 1)) | 0;
      const t = a[i]; a[i] = a[j]; a[j] = t;
    }
    return a;
  }

  function pick(arr, n) { return shuffle(arr).slice(0, n); }

  function byLetter(l) { return ALPHABET.find(x => x.letter === l); }

    let l;
    do { l = ALPHABET[(Math.random() * ALPHABET.length) | 0].letter; }
    while (exclude && l === exclude && ALPHABET.length > 1);
    return l;
  }

  /* ------------------------------ speech ------------------------------ */

  let voices = [];
  function refreshVoices() {
    try { voices = speechSynthesis.getVoices() || []; } catch (e) { voices = []; }
  }
  if ("speechSynthesis" in window) {
    refreshVoices();
    speechSynthesis.onvoiceschanged = refreshVoices;
  }

  let lastThrottle = 0;
  let speakTimer = null;
  let speakToken = 0;

  function pickVoice() {
    const en = voices.filter(v => v.lang && /^en/i.test(v.lang));
    return (
      en.find(v => /samantha|zira|aria|jenny|female|google us english/i.test(v.name || "")) ||
      en[0]
    );
  }

  function speak(text, opts) {
    opts = opts || {};
    if (!("speechSynthesis" in window) || !text) return;
    if (!speechOn && !opts.force) return;
    if (opts.throttle) {
      const now = Date.now();
      if (now - lastThrottle < 1600) return;
      lastThrottle = now;
    }
    // Chrome/Edge often drop speech if speak() runs immediately after cancel().
    // Delay slightly and resume if the engine got stuck paused.
    const myToken = ++speakToken;
    try {
      if (speakTimer) { clearTimeout(speakTimer); speakTimer = null; }
      speechSynthesis.cancel();
    } catch (e) {}

    speakTimer = setTimeout(() => {
      speakTimer = null;
      if (myToken !== speakToken) return;
      try {
        if (speechSynthesis.paused) speechSynthesis.resume();
        const u = new SpeechSynthesisUtterance(text);
        u.rate = opts.rate == null ? 0.85 : opts.rate;
        u.pitch = opts.pitch == null ? 1.1 : opts.pitch;
        u.volume = opts.volume == null ? 1 : opts.volume;
        const chosen = pickVoice();
        if (chosen) u.voice = chosen;
        speechSynthesis.speak(u);
        // Some Chrome builds need a second resume after queueing.
        if (speechSynthesis.paused) speechSynthesis.resume();
      } catch (e) {}
    }, 55);
  }

  /* ------------------------------ sounds ------------------------------ */

  let actx = null;
  function audio() {
    if (!actx) {
      const AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) return null;
      actx = new AC();
    }
    if (actx.state === "suspended") actx.resume().catch(() => {});
    return actx;
  }

  function tone(freq, delay, dur, type, vol) {
    const c = audio();
    if (!c) return;
    try {
      const t0 = c.currentTime + (delay || 0);
      const osc = c.createOscillator();
      const g = c.createGain();
      osc.type = type || "sine";
      osc.frequency.setValueAtTime(freq, t0);
      g.gain.setValueAtTime(0.0001, t0);
      g.gain.exponentialRampToValueAtTime(vol || 0.15, t0 + 0.02);
      g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
      osc.connect(g);
      g.connect(c.destination);
      osc.start(t0);
      osc.stop(t0 + dur + 0.06);
    } catch (e) {}
  }

  const snd = {
    correct() { [523.25, 659.25, 783.99].forEach((f, i) => tone(f, i * 0.08, 0.22, "triangle", 0.15)); },
    wrong()   { tone(340, 0, 0.14, "sine", 0.11); tone(262, 0.13, 0.18, "sine", 0.11); },
    fanfare() {

      tone(1318.5, 0.42, 0.4, "triangle", 0.13);

      if (!isEmoji) {

    streaks[g] = (streaks[g] || 0) + 1;

  VIEWS.learn = function () {
    titleEl.textContent = "📖 Learn the Letters";

    const grid = el("div", "grid learn-grid");
    ALPHABET.forEach((item, i) => {
      const cardWrap = el("div", "learn-card-wrap");
      const card = el("button", "card learn-card",
        `<span class="emoji-bubble">${item.emoji}</span><span class="letter">${item.letter}</span>`);
      card.setAttribute("style", tintStyle(i));
      card.style.animationDelay = (i * 0.03) + "s";
      card.addEventListener("click", () => openLearn(item));

      const speaker = el("button", "learn-card-speaker", "🔊");
      speaker.type = "button";
      speaker.setAttribute("aria-label", `Hear ${item.letter}, ${item.word}`);

  function sayLetterAndWord(item) {
    const sound = PHONICS[item.letter] || item.letter;
    // Letter name + phonics sound + word (e.g. "A. ah. Apple.")
    speak(`${item.letter}. ${sound}. ${item.word}.`, { rate: 0.72, pitch: 1.14, volume: 0.9 });
  }

  function openLearn(item) {
    snd.pop();
    let currentIndex = Math.max(0, ALPHABET.findIndex(x => x.letter === item.letter));
    let flipped = false;
    let slideLock = false;

    const overlay = el("div", "overlay");
    const box = el("div", "popup learn-popup", `
      <button class="close-btn" aria-label="Close">✖</button>
      <div class="learn-slider" aria-live="polite">
        <div class="learn-slide">
          <button type="button" class="flip-card" aria-label="Flip card">
            <span class="flip-inner">
              <span class="flip-face flip-front">
                <span class="learn-emoji learn-emoji-front"></span>
                <span class="learn-letter"></span>
                <span class="learn-phonics"></span>
                <span class="flip-cue">Tap to see the word</span>
              </span>
              <span class="flip-face flip-back">
                <span class="learn-emoji learn-emoji-back"></span>
                <span class="learn-word"></span>
                <span class="learn-phonics-back"></span>
              </span>
            </span>
          </button>
        </div>
      </div>
      <div class="learn-nav">
        <button class="learn-nav-btn previous" aria-label="Previous letter">←</button>
        <span class="learn-nav-counter"></span>
        <button class="learn-nav-btn next" aria-label="Next letter">→</button>
      </div>
      <div class="hint">👆 Swipe letters · tap card to flip · 🔊 hear again</div>`);
    overlay.appendChild(box);
    document.body.appendChild(overlay);

    const slider = $(".learn-slider", box);
    const slide = $(".learn-slide", box);
    const flipCard = $(".flip-card", box);
    const emojiFront = $(".learn-emoji-front", box);
    const emojiBack = $(".learn-emoji-back", box);
    const letter = $(".learn-letter", box);
    const word = $(".learn-word", box);
    const phonicsEl = $(".learn-phonics", box);
    const phonicsBack = $(".learn-phonics-back", box);
    const counter = $(".learn-nav-counter", box);
    const previous = $(".learn-nav-btn.previous", box);
    const next = $(".learn-nav-btn.next", box);

    const setFlipped = (on) => {
      flipped = !!on;
      flipCard.classList.toggle("is-flipped", flipped);
    };

    const showLetter = (opts) => {
      opts = opts || {};
      const currentItem = ALPHABET[currentIndex];
      const tint = tintFor(currentIndex);
      const sound = PHONICS[currentItem.letter] || currentItem.letter;
      box.setAttribute("style", `--accent:${tint[0]};--soft:${tint[1]}`);
      emojiFront.textContent = currentItem.emoji;
      emojiBack.textContent = currentItem.emoji;
      letter.textContent = currentItem.letter;
      word.textContent = currentItem.word;
      phonicsEl.textContent = `🔊 /${sound}/`;
      phonicsBack.textContent = `${currentItem.letter} says /${sound}/`;
      counter.textContent = `${currentItem.letter} of ${ALPHABET.length}`;
      previous.disabled = currentIndex === 0;
      next.disabled = currentIndex === ALPHABET.length - 1;
      flipCard.setAttribute(
        "aria-label",
        flipped
          ? `${currentItem.letter} says ${sound}. ${currentItem.letter} is for ${currentItem.word}. Tap to flip back.`
          : `Letter ${currentItem.letter} says ${sound}. Tap to flip.`
      );
      award(currentItem.letter);
      if (opts.speak !== false) sayLetterAndWord(currentItem);
    };

    const goTo = (index, direction) => {
      if (slideLock) return;
      const nextIndex = Math.max(0, Math.min(ALPHABET.length - 1, index));
      if (nextIndex === currentIndex) return;
      slideLock = true;
      setFlipped(false);
      const outClass = direction < 0 ? "slide-out-right" : "slide-out-left";
      const inClass = direction < 0 ? "slide-in-left" : "slide-in-right";
      slide.classList.remove("slide-out-left", "slide-out-right", "slide-in-left", "slide-in-right");
      void slide.offsetWidth;
      slide.classList.add(outClass);
      later(() => {
        currentIndex = nextIndex;
        showLetter();
        slide.classList.remove(outClass);
        void slide.offsetWidth;
        slide.classList.add(inClass);
        later(() => {
          slide.classList.remove(inClass);
          slideLock = false;
        }, 220);
      }, 160);
    };

    previous.addEventListener("click", () => {
      if (currentIndex === 0 || slideLock) return;
      snd.pop();
      goTo(currentIndex - 1, -1);
    });
    next.addEventListener("click", () => {
      if (currentIndex === ALPHABET.length - 1 || slideLock) return;
      snd.pop();
      goTo(currentIndex + 1, 1);
    });

    flipCard.addEventListener("click", e => {
      e.stopPropagation();
      if (slideLock) return;
      snd.flip();
      setFlipped(!flipped);
      sayLetterAndWord(ALPHABET[currentIndex]);
    });

    // Horizontal swipe between letters (ignore tiny moves / vertical scrolls).
    let touchStartX = 0;
    let touchStartY = 0;
    let swiping = false;
    slider.addEventListener("touchstart", e => {
      if (!e.touches || !e.touches[0]) return;
      touchStartX = e.touches[0].clientX;
      touchStartY = e.touches[0].clientY;
      swiping = true;
    }, { passive: true });
    slider.addEventListener("touchend", e => {
      if (!swiping) return;
      swiping = false;
      const t = e.changedTouches && e.changedTouches[0];
      if (!t) return;
      const dx = t.clientX - touchStartX;
      const dy = t.clientY - touchStartY;
      if (Math.abs(dx) < 48 || Math.abs(dx) < Math.abs(dy)) return;
      if (dx < 0) {
        if (currentIndex < ALPHABET.length - 1 && !slideLock) {
          snd.pop();
          goTo(currentIndex + 1, 1);
        }
      } else if (currentIndex > 0 && !slideLock) {
        snd.pop();
        goTo(currentIndex - 1, -1);
      }
    }, { passive: true });

    // Pointer drag support for desktop / mouse.
    let pointerStartX = null;
    slider.addEventListener("pointerdown", e => {
      if (e.pointerType === "touch") return;
      if (e.button != null && e.button !== 0) return;
      pointerStartX = e.clientX;
    });
    slider.addEventListener("pointerup", e => {
      if (pointerStartX == null || e.pointerType === "touch") return;
      const dx = e.clientX - pointerStartX;
      pointerStartX = null;
      if (Math.abs(dx) < 56) return;
      if (dx < 0) {
        if (currentIndex < ALPHABET.length - 1 && !slideLock) {
          snd.pop();
          goTo(currentIndex + 1, 1);
        }
      } else if (currentIndex > 0 && !slideLock) {
        snd.pop();
        goTo(currentIndex - 1, -1);
      }
    });
    slider.addEventListener("pointercancel", () => { pointerStartX = null; });

    $(".close-btn", box).addEventListener("click", e => {
      e.stopPropagation();
      overlay.remove();
    });
    overlay.addEventListener("click", e => {
      if (e.target === overlay) overlay.remove();
    });

    showLetter();
  }

  VIEWS.find = function () {
    titleEl.textContent = "🔊 Find It";

    function round() {
      token++;
      const n = [3, 4, 5][Math.min(levelOf("find"), 2)];
      const target = byLetter(pickLetterAvoiding(lastLetter));
      lastLetter = target.letter;

      const others = pick(ALPHABET.filter(x => x.letter !== target.letter), n - 1);
      const choices = shuffle([target].concat(others));

      screenRoot.innerHTML = "";
      const wrap = el("div", "find-wrap");

      const promptText = `Can you find the ${target.word.toLowerCase()}? ${PHONICS[target.letter] || target.letter} for ${target.word}.`;

      const ask = el("div", "ask-row");

      const bubble = el("div", "speech-bubble");

      repeat.setAttribute("aria-label", "Hear the question again");
      repeat.addEventListener("click", () => { snd.pop(); sayPrompt(); });
      bubble.append(el("span", "prompt-text", promptText), repeat);
      ask.append(avatar, bubble);

      const grid = el("div", "choice-grid");
      let done = false;

      choices.forEach((item, idx) => {
        const card = el("button", "card",
          `<span class="emoji-bubble">${item.emoji}</span><span class="word">${item.word}</span>`);
        card.setAttribute("style", tintStyle(idx + target.letter.charCodeAt(0)));
        card.addEventListener("click", () => {
          if (done) return;
          if (item.letter === target.letter) {
            done = true;
            card.classList.add("right");
            snd.correct();
            confetti(16);
            noteCorrect("find");
            award(target.letter);
            speak(`Yes! ${item.word}!`);
            later(round, 1500);
          } else {
            wobble(card);
            snd.wrong();
            noteWrong("find");
            speak("Try again!", { throttle: true });
          }
        });
        grid.appendChild(card);
      });

      wrap.append(ask, levelStars("find"), grid);
      screenRoot.appendChild(wrap);
      sayPrompt();
    }

    round();
  };

  function startMatch(mode) {
    const isPic = mode === "matchPic";
    titleEl.textContent = isPic ? "🍎 Picture Match" : "🔤 Letter Match";
    const inst = isPic
      ? "Match each letter to its picture!"
      : "Match the big letter to the small letter!";

    function round() {
      token++;
      const n = [3, 4, 5][Math.min(levelOf(mode), 2)];
      const letters = pick(ALPHABET, n);

      const rights = shuffle(letters.map(l => ({
        letter: l.letter,
        face: isPic ? l.emoji : l.letter.toLowerCase(),
        word: l.word,
        isEmoji: isPic,
      })));

      screenRoot.innerHTML = "";
      const wrap = el("div", "match-wrap");

      const head = el("div", "match-head");
      const instBtn = el("button", "repeat-btn small", "🔊");
      instBtn.setAttribute("aria-label", "Hear the instructions again");
      instBtn.addEventListener("click", () => { snd.pop(); speak(inst); });
      head.append(instBtn, levelStars(mode));

      const board = el("div", "match-board");
      const leftCol = el("div", "match-col");
      const rightCol = el("div", "match-col");
      const leftWrap = el("div", "match-col-wrap");
      const rightWrap = el("div", "match-col-wrap");
      leftWrap.append(el("div", "col-chip", "🔤"), leftCol);
      rightWrap.append(el("div", "col-chip", isPic ? "🖼️" : "abc"), rightCol);

      let selected = null;
      let matchedCount = 0;
      let done = false;

      letters.forEach(l => {
        const card = el("button", "card left-card", `<span>${l.letter}</span>`);
        card.dataset.pair = l.letter;
        card.addEventListener("click", () => {
          if (done || card.classList.contains("matched")) return;
          if (selected === card) {
            card.classList.remove("selected");
            selected = null;
            return;
          }
          if (selected) selected.classList.remove("selected");
          selected = card;
          card.classList.add("selected");
          snd.pop();
          speak(`${PHONICS[l.letter] || l.letter}. ${l.letter}`);
        });
        leftCol.appendChild(card);
      });

      rights.forEach(r => {
        const inner = r.isEmoji
          ? `<span class="pair-emoji">${r.face}</span>`
          : `<span class="lower">${r.face}</span>`;
        const card = el("button", "card right-card", inner);
        card.dataset.pair = r.letter;

        card.addEventListener("click", () => {
          if (done || card.classList.contains("matched")) return;

          if (!selected) {
            wobble(card);
            snd.wrong();
            speak("Tap a letter first!", { throttle: true });
            return;
          }

          if (selected.dataset.pair === card.dataset.pair) {
            const left = selected;
            selected = null;
            left.classList.remove("selected");
            left.classList.add("matched");
            card.classList.add("matched");
            matchedCount++;

            snd.correct();
            confetti(8);
            noteCorrect(mode);
            award(r.letter);
            speak(isPic ? r.word : `${PHONICS[r.letter] || r.letter}. ${r.letter}`);

            if (matchedCount === n) {
              done = true;
              later(() => { snd.fanfare(); confetti(30); speak("Well done!"); }, 350);
              later(round, 1900);
            }
          } else {
            const left = selected;
            selected = null;
            left.classList.remove("selected");
            wobble(left);
            wobble(card);
            snd.wrong();
            noteWrong(mode);
            speak("Try again!", { throttle: true });
          }
        });

        rightCol.appendChild(card);
      });

      board.append(leftWrap, rightWrap);
      wrap.append(head, board);
      screenRoot.appendChild(wrap);
      speak(inst);
    }

    round();
  }

  VIEWS.memory = function () {
    titleEl.textContent = "🃏 Memory Fun";

    const configs = [
      { pairs: 4, type: "emoji" },
      { pairs: 6, type: "emoji" },
      { pairs: 4, type: "lp" },   // letter <-> picture pairs
      { pairs: 6, type: "lp" },
    ];

    function round() {
      token++;
      const cfg = configs[Math.min(levelOf("memory"), configs.length - 1)];
      const letters = pick(ALPHABET, cfg.pairs);

      let cards = [];
      letters.forEach(l => {
        if (cfg.type === "emoji") {
          cards.push({ match: l.letter, face: l.emoji, letter: l.letter });
          cards.push({ match: l.letter, face: l.emoji, letter: l.letter });
        } else {
          cards.push({ match: l.letter, face: l.letter, letter: l.letter });
          cards.push({ match: l.letter, face: l.emoji, letter: l.letter });
        }
      });
      cards = shuffle(cards);

      screenRoot.innerHTML = "";
      const wrap = el("div", "mem-wrap");
      wrap.appendChild(levelStars("memory"));

      const grid = el("div", "memory-grid");

      let flipped = [];
      let lock = false;
      let found = 0;
      let done = false;

      cards.forEach((data, i) => {
        const btn = el("button", "mem-card", `
          <span class="mem-inner">
            <span class="mem-face mem-back">⭐</span>
            <span class="mem-face mem-front">${data.face}</span>
          </span>`);
        btn.style.setProperty("--rot", (((i * 37) % 7) - 3) + "deg");

        btn.addEventListener("click", () => {
          if (done || lock) return;
          if (btn.classList.contains("flipped") || btn.classList.contains("done")) return;

          btn.classList.add("flipped");
          snd.flip();
          flipped.push({ btn, data });

          if (flipped.length === 2) {
            lock = true;
            const a = flipped[0];
            const b = flipped[1];

            if (a.data.match === b.data.match) {
              later(() => {
                a.btn.classList.add("done");
                b.btn.classList.add("done");
                snd.correct();
                award(a.data.letter);
                found++;
                flipped = [];
                lock = false;
                if (found === cfg.pairs) {
                  done = true;
                  snd.fanfare();
                  confetti(30);
                  speak("Well done! You found them all!");
                  later(round, 2300);
                }
              }, 420);
            } else {
              later(() => {
                a.btn.classList.remove("flipped");
                b.btn.classList.remove("flipped");
                snd.wrong();
                flipped = [];
                lock = false;
              }, 950);
            }
          }
        });

        grid.appendChild(btn);
      });

      wrap.appendChild(grid);
      screenRoot.appendChild(wrap);
      speak(cfg.type === "emoji"
        ? "Find the matching pairs!"
        : "Find the letter and its picture!");
    }

    round();
  };

  VIEWS.coloring = function () {
