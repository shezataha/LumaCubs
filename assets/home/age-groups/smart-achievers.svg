<svg xmlns="http://www.w3.org/2000/svg" width="640" height="480" viewBox="0 0 640 480" fill="none" role="img" aria-label="Smart Achievers illustration">
  <defs>
    <linearGradient id="saBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FFF1D6"/>
      <stop offset="55%" stop-color="#FFE3B8"/>
      <stop offset="100%" stop-color="#FFD3A8"/>
    </linearGradient>
    <linearGradient id="saFur" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFE4C8"/>
      <stop offset="100%" stop-color="#FFC59A"/>
    </linearGradient>
    <linearGradient id="saStar" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FFE29A"/>
      <stop offset="100%" stop-color="#F0B84A"/>
    </linearGradient>
    <linearGradient id="saBadge" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFB894"/>
      <stop offset="100%" stop-color="#F08A5A"/>
    </linearGradient>
    <filter id="saSoft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#C48A50" flood-opacity="0.18"/>
    </filter>
  </defs>
  <rect width="640" height="480" rx="48" fill="url(#saBg)"/>
  <circle cx="80" cy="80" r="60" fill="#FFF8EC" opacity="0.55"/>
  <circle cx="560" cy="70" r="78" fill="#FFB894" opacity="0.28"/>
  <circle cx="100" cy="400" r="88" fill="#FFE29A" opacity="0.3"/>
  <ellipse cx="330" cy="420" rx="220" ry="26" fill="#E0A86A" opacity="0.22"/>

  <!-- notebook + pencil -->
  <g filter="url(#saSoft)">
    <rect x="86" y="200" width="150" height="190" rx="18" fill="#FFFCF8"/>
    <rect x="86" y="200" width="18" height="190" rx="8" fill="#A8D4F0"/>
    <rect x="120" y="230" width="96" height="10" rx="5" fill="#E8D5F5" opacity="0.85"/>
    <rect x="120" y="254" width="86" height="8" rx="4" fill="#C8F0E0"/>
    <rect x="120" y="276" width="92" height="8" rx="4" fill="#FFD8C2"/>
    <rect x="120" y="298" width="78" height="8" rx="4" fill="#A8D4F0" opacity="0.8"/>
    <rect x="120" y="320" width="88" height="8" rx="4" fill="#FFE29A" opacity="0.9"/>
    <rect x="210" y="170" width="18" height="160" rx="8" transform="rotate(18 210 170)" fill="#F4A261"/>
    <polygon points="236,318 248,330 228,336" fill="#4A4458"/>
    <rect x="214" y="168" width="18" height="22" rx="4" transform="rotate(18 214 168)" fill="#FFB4C8"/>
  </g>

  <!-- proud cub with star badge -->
  <g filter="url(#saSoft)">
    <ellipse cx="430" cy="250" rx="26" ry="24" fill="url(#saFur)"/>
    <ellipse cx="520" cy="250" rx="26" ry="24" fill="url(#saFur)"/>
    <ellipse cx="430" cy="252" rx="12" ry="11" fill="#FFF6EC"/>
    <ellipse cx="520" cy="252" rx="12" ry="11" fill="#FFF6EC"/>
    <ellipse cx="475" cy="305" rx="78" ry="72" fill="url(#saFur)"/>
    <ellipse cx="475" cy="322" rx="46" ry="36" fill="#FFF6EC"/>
    <circle cx="450" cy="292" r="7" fill="#4A4458"/>
    <circle cx="500" cy="292" r="7" fill="#4A4458"/>
    <circle cx="452" cy="290" r="2.2" fill="#fff"/>
    <circle cx="502" cy="290" r="2.2" fill="#fff"/>
    <ellipse cx="442" cy="310" rx="11" ry="8" fill="#FFB4C8" opacity="0.8"/>
    <ellipse cx="508" cy="310" rx="11" ry="8" fill="#FFB4C8" opacity="0.8"/>
    <ellipse cx="475" cy="312" rx="10" ry="8" fill="#F4A261"/>
    <path d="M458 334 Q475 350 492 334" stroke="#4A4458" stroke-width="4" fill="none" stroke-linecap="round"/>
    <!-- badge -->
    <circle cx="475" cy="372" r="36" fill="url(#saBadge)"/>
    <circle cx="475" cy="372" r="28" fill="url(#saStar)"/>
    <path d="M475 352 L481 366 L496 368 L485 378 L488 393 L475 385 L462 393 L465 378 L454 368 L469 366 Z" fill="#FFF8EC"/>
  </g>

  <circle cx="280" cy="110" r="6" fill="#FFF8EC"/>
  <circle cx="360" cy="90" r="5" fill="#FFB894"/>
  <circle cx="540" cy="160" r="4" fill="#8ED9BE"/>
</svg>
