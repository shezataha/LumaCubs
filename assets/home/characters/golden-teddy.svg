<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 260" role="img" aria-label="Golden teddy bear">
  <defs>
    <radialGradient id="teddyFur" cx="40%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#F0C98A"/>
      <stop offset="55%" stop-color="#E0A85C"/>
      <stop offset="100%" stop-color="#C9893E"/>
    </radialGradient>
    <radialGradient id="teddyBelly" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#F8E2B8"/>
      <stop offset="100%" stop-color="#EBC48A"/>
    </radialGradient>
    <radialGradient id="teddyEar" cx="40%" cy="35%" r="60%">
      <stop offset="0%" stop-color="#D49A52"/>
      <stop offset="100%" stop-color="#B87A38"/>
    </radialGradient>
  </defs>
  <ellipse cx="120" cy="248" rx="58" ry="10" fill="rgba(74,68,88,0.12)"/>
  <!-- legs -->
  <ellipse cx="88" cy="210" rx="28" ry="22" fill="url(#teddyFur)"/>
  <ellipse cx="152" cy="210" rx="28" ry="22" fill="url(#teddyFur)"/>
  <ellipse cx="88" cy="220" rx="16" ry="10" fill="#8B5A2B" opacity="0.55"/>
  <ellipse cx="152" cy="220" rx="16" ry="10" fill="#8B5A2B" opacity="0.55"/>
  <!-- arms -->
  <g class="teddy-arm-l">
    <ellipse cx="52" cy="150" rx="24" ry="18" fill="url(#teddyFur)" transform="rotate(-18 52 150)"/>
    <ellipse cx="42" cy="158" rx="12" ry="8" fill="#8B5A2B" opacity="0.5"/>
  </g>
  <g class="teddy-arm-r">
    <ellipse cx="188" cy="128" rx="24" ry="18" fill="url(#teddyFur)" transform="rotate(28 188 128)"/>
    <ellipse cx="200" cy="120" rx="12" ry="8" fill="#8B5A2B" opacity="0.5"/>
  </g>
  <!-- body -->
  <ellipse cx="120" cy="160" rx="58" ry="52" fill="url(#teddyFur)"/>
  <ellipse cx="120" cy="168" rx="34" ry="30" fill="url(#teddyBelly)"/>
  <!-- ears -->
  <circle cx="68" cy="58" r="28" fill="url(#teddyEar)"/>
  <circle cx="172" cy="58" r="28" fill="url(#teddyEar)"/>
  <circle cx="68" cy="58" r="14" fill="#F3C98F"/>
  <circle cx="172" cy="58" r="14" fill="#F3C98F"/>
  <!-- head -->
  <circle cx="120" cy="88" r="54" fill="url(#teddyFur)"/>
  <ellipse cx="120" cy="102" rx="28" ry="22" fill="url(#teddyBelly)"/>
  <!-- face -->
  <circle cx="100" cy="82" r="6.5" fill="#3A2F45"/>
  <circle cx="140" cy="82" r="6.5" fill="#3A2F45"/>
  <circle cx="102" cy="80" r="2" fill="#fff" opacity="0.85"/>
  <circle cx="142" cy="80" r="2" fill="#fff" opacity="0.85"/>
  <ellipse cx="120" cy="98" rx="9" ry="7" fill="#5B3A28"/>
  <path d="M108 112c7 8 17 8 24 0" fill="none" stroke="#8B4A3A" stroke-width="3.2" stroke-linecap="round"/>
  <circle cx="96" cy="100" r="7" fill="#E8A090" opacity="0.35"/>
  <circle cx="144" cy="100" r="7" fill="#E8A090" opacity="0.35"/>
</svg>
